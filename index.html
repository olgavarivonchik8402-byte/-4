<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Миссия: Лунная Походка</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Marck+Script&family=Playfair+Display:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root{
  --bg:#050a1a;
  --bg2:#0d1730;
  --card:#111d3d;
  --gold:#f2b544;
  --gold-bright:#ffd873;
  --pink:#ff3d94;
  --pink-bright:#ff6fb4;
  --turquoise:#2ee6c9;
  --purple:#a76bff;
  --red:#ff4d5e;
  --silver:#c9cdd4;
  --white:#f5f4ef;
  --violet:#4c1d76;
  --violet-glow:#5b8dee;
  --muted:#8b8fb8;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse 800px 500px at 50% -10%, rgba(91,141,238,0.25), transparent 60%),
    radial-gradient(ellipse 600px 400px at 90% 100%, rgba(217,164,65,0.10), transparent 60%),
    var(--bg);
  color:var(--white);
  font-family:'Space Grotesk', sans-serif;
  overflow-x:hidden;
}

.display{
  font-family:'Playfair Display', serif;
  font-weight:400;
  letter-spacing:0.01em;
  line-height:0.95;
}

.starfield{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(1.6px 1.6px at 8% 12%, rgba(255,255,255,0.9), transparent 60%),
    radial-gradient(1.2px 1.2px at 18% 28%, rgba(255,255,255,0.6), transparent 60%),
    radial-gradient(1.8px 1.8px at 32% 8%, rgba(255,255,255,0.8), transparent 60%),
    radial-gradient(1.2px 1.2px at 46% 22%, rgba(255,255,255,0.55), transparent 60%),
    radial-gradient(1.6px 1.6px at 62% 14%, rgba(255,255,255,0.75), transparent 60%),
    radial-gradient(1.2px 1.2px at 75% 30%, rgba(255,255,255,0.5), transparent 60%),
    radial-gradient(1.8px 1.8px at 88% 10%, rgba(255,255,255,0.8), transparent 60%),
    radial-gradient(1.2px 1.2px at 12% 45%, rgba(255,255,255,0.5), transparent 60%),
    radial-gradient(1.6px 1.6px at 28% 58%, rgba(255,255,255,0.7), transparent 60%),
    radial-gradient(1.2px 1.2px at 54% 48%, rgba(255,255,255,0.5), transparent 60%),
    radial-gradient(1.6px 1.6px at 70% 62%, rgba(255,255,255,0.7), transparent 60%),
    radial-gradient(1.2px 1.2px at 90% 52%, rgba(255,255,255,0.55), transparent 60%),
    radial-gradient(1.6px 1.6px at 15% 78%, rgba(255,255,255,0.65), transparent 60%),
    radial-gradient(1.2px 1.2px at 40% 88%, rgba(255,255,255,0.5), transparent 60%),
    radial-gradient(1.6px 1.6px at 65% 82%, rgba(255,255,255,0.65), transparent 60%),
    radial-gradient(1.2px 1.2px at 85% 92%, rgba(255,255,255,0.5), transparent 60%),
    radial-gradient(ellipse 640px 820px at 78% -4%, rgba(46,230,201,0.22), transparent 62%),
    radial-gradient(ellipse 520px 620px at 4% 18%, rgba(255,61,148,0.16), transparent 60%),
    radial-gradient(ellipse 460px 540px at 96% 40%, rgba(167,107,255,0.14), transparent 60%),
    radial-gradient(ellipse 420px 520px at 12% 6%, rgba(217,164,65,0.14), transparent 60%);
}

#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  padding:24px 20px 100px;
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
}

.screen{ display:none; flex:1; flex-direction:column; animation:rise 0.5s ease both; }
.screen.active{ display:flex; }

/* ---------- TABLET / LARGER SCREENS ---------- */
@media (min-width:640px){
  #app{
    max-width:600px;
    padding:36px 32px 110px;
  }
  .title-main{ font-size:76px; }
  .subtitle{ font-size:16.5px; max-width:380px; }
  .task-title{ font-size:32px; }
  .task-body{ font-size:16.5px; }
  .card{ padding:30px 26px; }
  .btn{ font-size:17px; padding:17px 30px; }
  .name-row, .btn-primary, .btn-ghost{ max-width:340px; }
  .pad-grid{ max-width:360px; margin-left:auto; margin-right:auto; }
  .pad{ height:92px; }
  .puzzle-wrap{ max-width:520px; margin-left:auto; margin-right:auto; }
  .rhythm-pattern{ font-size:42px; }
  .footbar{ padding:20px 20px 26px; }
}

/* ---------- SHORT / LANDSCAPE VIEWPORTS ---------- */
@media (max-height:560px) and (orientation:landscape){
  #app{ padding-top:16px; padding-bottom:80px; }
  .hero-scene{ display:none; }
  .title-main{ font-size:44px; }
  .footbar{ padding:10px 20px 14px; }
}

@keyframes rise{
  from{ opacity:0; transform:translateY(16px); }
  to{ opacity:1; transform:translateY(0); }
}

/* ---------- glove icon, used once as signature motif ---------- */
.hero-scene{
  width:220px;
  height:auto;
  margin:0 auto 8px;
  filter:drop-shadow(0 0 28px rgba(217,164,65,0.25));
}

}
.start-panel{
  width:100%;
  background:rgba(8,6,26,0.5);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,216,115,0.18);
  border-radius:22px;
  padding:22px 18px 26px;
}
#screen-intro-video{
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:-24px -20px 0;
  padding:24px 20px;
  background:var(--bg);
}
.intro-video-wrap{
  width:100%;
  max-width:340px;
  border-radius:20px;
  overflow:hidden;
  border:1px solid rgba(255,216,115,0.25);
  box-shadow:0 0 30px rgba(217,164,65,0.2);
}
.intro-video-wrap video{
  width:100%;
  display:block;
}
.kicker{
  color:var(--gold);
  font-size:13px;
  letter-spacing:0.14em;
  margin-bottom:10px;
}
.title-main{
  font-family:'Marck Script', cursive;
  font-weight:400;
  font-size:60px;
  line-height:1.35;
  padding-top:8px;
  background:linear-gradient(135deg, var(--gold-bright), var(--gold) 60%, var(--gold-bright));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 34px rgba(217,164,65,0.45);
}
.title-main span{
  display:block;
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size:14px;
  letter-spacing:0.14em;
  background:none;
  -webkit-background-clip:initial;
  background-clip:initial;
  color:var(--muted);
  text-shadow:none;
  margin-top:6px;
}
.subtitle{
  color:var(--muted);
  font-size:15px;
  line-height:1.5;
  max-width:320px;
  margin:16px auto 28px;
}
.name-row{
  display:flex;
  gap:8px;
  width:100%;
  max-width:300px;
  margin-bottom:18px;
}
.name-field{
  width:100%;
  max-width:none;
  padding:14px 16px;
  border-radius:10px;
  border:1px solid #3a3040;
  background:var(--card);
  color:var(--white);
  font-family:inherit;
  font-size:16px;
  margin-bottom:0;
  text-align:center;
}
.name-field::placeholder{ color:var(--muted); }
.mic-btn{
  flex-shrink:0;
  width:48px;
  border-radius:10px;
  border:1px solid #3a3040;
  background:var(--card);
  font-size:18px;
  cursor:pointer;
  color:var(--white);
  transition:background 0.15s ease, border-color 0.15s ease;
}
.mic-btn.listening{
  background:rgba(217,164,65,0.18);
  border-color:var(--gold);
  animation:micPulse 1s ease-in-out infinite;
}
.mic-btn[disabled]{ opacity:0.35; cursor:not-allowed; }
@keyframes micPulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(217,164,65,0.5); }
  50%{ box-shadow:0 0 0 8px rgba(217,164,65,0); }
}

.btn{
  border:none;
  border-radius:10px;
  padding:16px 28px;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  transition:transform 0.15s ease, box-shadow 0.15s ease;
}
.btn:active{ transform:scale(0.97); }
.btn-primary{
  background:linear-gradient(135deg, var(--pink), var(--gold));
  color:#1a1408;
  box-shadow:0 8px 24px rgba(255,61,148,0.28);
  width:100%;
  max-width:300px;
}
.btn-ghost{
  background:transparent;
  color:var(--silver);
  border:1px solid #3a3040;
  width:100%;
  max-width:300px;
  margin-top:10px;
}

/* ---------- TOP BAR (during quest) ---------- */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:22px;
}
.track-label{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--muted);
  font-size:12px;
  letter-spacing:0.1em;
}
.disco-mini{ flex-shrink:0; }
.track-num{
  font-family:'Playfair Display',serif;
  font-size:15px;
  color:var(--gold);
}

.card{
  background:var(--card);
  border:1px solid #2c2434;
  border-radius:16px;
  padding:24px 20px;
  margin-bottom:16px;
}

.task-cover{
  width:100%;
  aspect-ratio:16/10;
  border-radius:18px;
  overflow:hidden;
  margin-bottom:16px;
  background:var(--bg2);
  border:1px solid rgba(217,164,65,0.3);
  box-shadow:0 0 26px rgba(91,141,238,0.15);
  display:none;
}
.task-cover.has-media{ display:block; }
.task-cover img, .task-cover video{
  width:100%; height:100%;
  object-fit:cover;
  display:block;
}

.task-tag{
  display:inline-block;
  font-size:11px;
  letter-spacing:0.08em;
  color:var(--violet-glow);
  background:rgba(91,141,238,0.15);
  border:1px solid rgba(91,141,238,0.35);
  padding:4px 10px;
  border-radius:20px;
  margin-bottom:14px;
}
.task-tag.outdoor{ color:var(--gold-bright); background:rgba(217,164,65,0.12); border-color:rgba(217,164,65,0.35); }

.task-title{
  font-family:'Playfair Display',serif;
  font-size:28px;
  color:var(--white);
  margin:0 0 12px;
  line-height:1.05;
}
.task-body{
  color:var(--silver);
  font-size:15.5px;
  line-height:1.55;
  margin-bottom:10px;
}
.task-hint{
  color:var(--muted);
  font-size:13.5px;
  line-height:1.5;
  border-left:2px solid var(--gold);
  padding-left:12px;
  margin-top:14px;
}

/* quiz options */
.opt{
  display:block;
  width:100%;
  text-align:left;
  background:var(--bg2);
  border:1px solid #332a3d;
  color:var(--white);
  padding:14px 16px;
  border-radius:10px;
  margin-bottom:10px;
  font-family:inherit;
  font-size:15px;
  cursor:pointer;
}
.opt.correct{ border-color:var(--gold); background:rgba(217,164,65,0.12); }
.opt.wrong{ border-color:var(--red); background:rgba(200,30,58,0.12); }

/* photo/video capture */
.capture-box{
  border:2px dashed #3a3040;
  border-radius:14px;
  padding:22px;
  text-align:center;
  color:var(--muted);
  margin-top:6px;
}
.capture-box input{ display:none; }
.capture-preview{
  width:100%;
  border-radius:10px;
  margin-top:12px;
  display:none;
}

/* simon-style light game */
.pad-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:18px 0 6px;
}
.pad{
  height:76px;
  border-radius:14px;
  border:none;
  opacity:0.55;
  transition:opacity 0.15s ease, transform 0.1s ease;
}
.pad:active{ transform:scale(0.96); }
.pad.lit{ opacity:1; box-shadow:0 0 30px currentColor; }
.pad-gold{ background:var(--gold); color:var(--gold-bright); }
.pad-red{ background:var(--red); color:#ff6b85; }
.pad-silver{ background:var(--silver); color:#fff; }
.pad-violet{ background:var(--violet-glow); color:#c4a7ff; }
.game-status{ text-align:center; color:var(--muted); font-size:13px; margin-top:6px; min-height:18px; }

/* progress footsteps */
.footbar{
  position:fixed;
  left:0; right:0; bottom:0;
  background:linear-gradient(0deg, var(--bg) 60%, transparent);
  padding:18px 20px 22px;
  display:flex;
  justify-content:center;
  gap:8px;
  z-index:5;
}
.foot{
  width:10px; height:10px;
  border-radius:50%;
  background:#332a3d;
  transition:background 0.3s ease, transform 0.3s ease;
}
.foot.done{ background:var(--gold-bright); transform:scale(1.3); }
.foot.now{ background:var(--violet-glow); transform:scale(1.3); }

/* finale */
#screen-finale{ justify-content:center; align-items:center; text-align:center; }
.finale-video{
  width:220px;
  max-width:70%;
  border-radius:50%;
  margin:0 auto 18px;
  box-shadow:0 0 40px rgba(217,164,65,0.35);
  object-fit:cover;
  aspect-ratio:1/1;
}
.finale-msg{
  color:var(--silver);
  font-size:16px;
  line-height:1.6;
  max-width:320px;
  margin:14px auto 30px;
}
.confetti{
  position:fixed; inset:0; pointer-events:none; z-index:2; overflow:hidden;
}
.bit{
  position:absolute; top:-20px;
  width:8px; height:14px;
  opacity:0.9;
  animation:fall linear forwards;
}
@keyframes fall{
  to{ transform:translateY(110vh) rotate(540deg); opacity:0.2; }
}

/* puzzle-reveal task */
.puzzle-wrap{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  border-radius:14px;
  overflow:hidden;
  background:#000 center/cover no-repeat;
  margin-bottom:14px;
}
.puzzle-grid{
  position:absolute; inset:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(3,1fr);
}
.puzzle-tile{
  background:linear-gradient(135deg, var(--violet), var(--bg2));
  border:1px solid rgba(245,244,239,0.08);
  display:flex; align-items:center; justify-content:center;
  font-family:'Playfair Display',serif;
  font-size:20px;
  color:var(--gold-bright);
  cursor:pointer;
  transition:opacity 0.3s ease, transform 0.3s ease;
}
.puzzle-tile.gone{ opacity:0; pointer-events:none; transform:scale(0.85); }
/* rebus task */
.rebus-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  margin:12px 0 18px;
}
.rebus-card{
  position:relative;
  width:108px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.rebus-icon{
  width:88px; height:88px;
  background:var(--bg2);
  border:1px solid #332a3d;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.rebus-commas{
  position:absolute;
  display:flex;
  gap:4px;
  font-family:'Playfair Display',serif;
  font-size:28px;
  color:var(--gold-bright);
  line-height:1;
}
.rebus-commas.right{ top:-6px; right:0; }
.rebus-commas.left{ top:-6px; left:0; }
.rebus-letter{
  font-family:'Playfair Display',serif;
  font-size:44px;
  color:var(--gold-bright);
}
.rebus-badge{
  position:absolute;
  bottom:14px; left:-10px;
  background:var(--gold-bright);
  color:#1a1408;
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:12px;
  padding:3px 7px;
  border-radius:6px;
  transform:rotate(-6deg);
}
.rebus-op{
  font-family:'Playfair Display',serif;
  font-size:26px;
  color:var(--muted);
}
.puzzle-answer-row{ display:flex; gap:8px; margin-top:6px; }
.puzzle-answer-row input{
  flex:1;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid #3a3040;
  background:var(--bg2);
  color:var(--white);

  font-size:15px;
}

  padding:12px 18px;
  border-radius:10px;

  font-family:inherit;
  font-weight:700;
  cursor:pointer;
}
.mic-btn-inline{
  flex-shrink:0;
  width:44px;
  padding:0 !important;
  border-radius:10px;

  color:var(--white);
}

  border-color:var(--gold) !important;

}

.puzzle-feedback{ margin-top:10px; font-size:13.5px; color:var(--muted); min-height:18px; }
.puzzle-feedback.win{ color:var(--gold-bright); }

/* ---- Голосовой ввод имени ---- */
(function initVoiceInput(){
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('micBtn');
  if(!SpeechRec){
    micBtn.disabled = true;
    micBtn.title = 'Голосовой ввод не поддерживается этим браузером';
    return;
  }
  const recognition = new SpeechRec();
  recognition.lang = 'ru-RU';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  let listening = false;

  micBtn.addEventListener('click', ()=>{
    if(listening) return;
    listening = true;
    micBtn.classList.add('listening');
    recognition.start();
  });

  recognition.onresult = (e)=>{
    const said = e.results[0][0].transcript;
    const cleaned = said.trim().replace(/^./, c=>c.toUpperCase());
    document.getElementById('kidName').value = cleaned;
  };

  recognition.onerror = ()=>{
    listening = false;
    micBtn.classList.remove('listening');
  };

  recognition.onend = ()=>{
    listening = false;
    micBtn.classList.remove('listening');
  };
})();

function startQuest(){
  const val = document.getElementById('kidName').value.trim();
  if(val) kidName = val;
  showScreen('screen-intro-video');
  const video = document.getElementById('introVideo');
  video.currentTime = 0;
  video.play().catch(()=>{});
}

function proceedToQuest(){
  const video = document.getElementById('introVideo');
  video.pause();
  buildFootbar();
  nextTask();
}

function buildFootbar(){
  const bar = document.getElementById('footbar');
  bar.innerHTML = "";
  for(let i=0;i<tasks.length;i++){
    const d = document.createElement('div');
    d.className = 'foot';
    d.id = 'foot-'+i;
    bar.appendChild(d);
  }
}

function updateFootbar(){
  tasks.forEach((_,i)=>{
    const el = document.getElementById('foot-'+i);
    el.classList.remove('done','now');
    if(i < current) el.classList.add('done');
    else if(i === current) el.classList.add('now');
  });
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function nextTask(){
  current++;
  if(current >= tasks.length){
    finishQuest();
    return;
  }
  renderTask(tasks[current]);
  updateFootbar();
  showScreen('screen-task');
}

function completeTask(){
  nextTask();
}

/* ---- Обложка задания: cover-N.jpg (или .png/.mp4), кладёшь рядом с квестом ---- */
/* Пробует .jpg, затем .png, затем .jpeg — на случай разных расширений на GitHub */
function loadImageWithFallback(img, baseName, onFound, onFail){
  const exts = ['jpg','png','jpeg'];
  let i = 0;
  function tryNext(){
    if(i >= exts.length){ if(onFail) onFail(); return; }
    img.onload = ()=>{ if(onFound) onFound(); };
    img.onerror = ()=>{ i++; tryNext(); };
    img.src = baseName + '.' + exts[i];
  }
  tryNext();
}

/* То же самое, но для CSS background-image (пробует расширения через скрытый Image) */
function loadBackgroundWithFallback(el, baseName){
  const probe = new Image();
  loadImageWithFallback(probe, baseName,
    ()=>{ el.style.backgroundImage = `url('${probe.src}')`; },
    ()=>{}
  );
}

function loadTaskCover(slug){
  const wrap = document.getElementById('taskCover');
  const img = document.getElementById('taskCoverImg');
  wrap.classList.remove('has-media');
  loadImageWithFallback(img, 'cover-' + slug,
    ()=>{ wrap.classList.add('has-media'); },
    ()=>{ wrap.classList.remove('has-media'); }
  );
}

function renderTask(t){
  document.getElementById('trackLabel').textContent = 'ТРЕК ' + String(current+1).padStart(2,'0') + ' / ' + String(tasks.length).padStart(2,'0');
  document.getElementById('trackTimer').textContent = '';
  const tag = document.getElementById('taskTag');
  tag.textContent = t.tag;
  tag.className = 'task-tag ' + t.tagClass;
  document.getElementById('taskTitle').textContent = t.title;
  document.getElementById('taskBody').textContent = t.body;

  loadTaskCover(t.slug);

  const hint = document.getElementById('taskHint');
  if(t.hint){ hint.style.display='block'; hint.textContent = t.hint; }
  else { hint.style.display='none'; }

  const box = document.getElementById('taskInteractive');
  box.innerHTML = '';

  if(t.type === 'puzzle'){
    initPuzzleGame(t);
  }
  else if(t.type === 'wordinput'){
    initWordInput(t);
  }
  else if(t.type === 'rebus'){
    initRebusGame(t);
  }
  else if(t.type === 'quiz'){
    t.options.forEach((opt, idx)=>{
      const b = document.createElement('button');
      b.className = 'opt';
      b.textContent = opt;
      b.onclick = ()=>{
        document.querySelectorAll('.opt').forEach(o=>o.disabled=true);
        if(idx === t.correct){ b.classList.add('correct'); setTimeout(nextTask, 700); }
        else {
          b.classList.add('wrong');
          document.querySelectorAll('.opt')[t.correct].classList.add('correct');
          setTimeout(nextTask, 1000);
        }
      };
      box.appendChild(b);
    });
  }
  else if(t.type === 'photo' || t.type === 'video'){
    if(t.slug === 'mumiya'){
      const musicBtn = document.createElement('button');
      musicBtn.className = 'btn btn-ghost';
      musicBtn.style.marginBottom = '14px';
      musicBtn.textContent = '🎵 Включить музыку';
      const balloonMusic = document.getElementById('balloonMusic');
      let playing = false;
      musicBtn.onclick = ()=>{
        if(!playing){
          balloonMusic.currentTime = 0;
          balloonMusic.play().catch(()=>{});
          musicBtn.textContent = '⏸ Выключить музыку';
          playing = true;
        } else {
          balloonMusic.pause();
          musicBtn.textContent = '🎵 Включить музыку';
          playing = false;
        }
      };
      box.appendChild(musicBtn);
    }

    const wrap = document.createElement('div');
    wrap.className = 'capture-box';
    const isVideo = t.type === 'video';
    wrap.innerHTML = `
      <div>${isVideo ? '🎥 Нажми, чтобы снять видео' : '📸 Нажми, чтобы сделать фото'}</div>
      <input type="file" id="cap-${current}" accept="${isVideo?'video/*':'image/*'}" capture="environment">
      ${isVideo
        ? '<video class="capture-preview" id="prev-'+current+'" controls></video>'
        : '<img class="capture-preview" id="prev-'+current+'">'}
    `;
    wrap.querySelector('input').addEventListener('change', function(e){
      if(e.target.files && e.target.files[0]){
        const url = URL.createObjectURL(e.target.files[0]);
        const prev = document.getElementById('prev-'+current);
        prev.src = url;
        prev.style.display = 'block';
        if(t.slug === 'mumiya'){
          const balloonMusic = document.getElementById('balloonMusic');
          balloonMusic.pause();
        }
        setTimeout(nextTask, 900);
      }
    });
    wrap.addEventListener('click', function(e){
      if(e.target.tagName !== 'INPUT'){ wrap.querySelector('input').click(); }
    });
    box.appendChild(wrap);
  }
  else if(t.type === 'soundguess'){
    initSoundGuess(t);
  }
  else if(t.type === 'photoclue'){
    initPhotoClue(t);
  }
  else if(t.type === 'rhythm'){
    initRhythmGame();
  }
  else if(t.type === 'masterclass'){
    box.innerHTML = `
      <button class="btn btn-primary" id="mcStartBtn" style="margin-bottom:14px;">Включить музыку</button>
      <div class="game-status" id="mcStatus"></div>
      <div id="mcCaptureArea"></div>
    `;
    initMasterclassGame();
  }
  else if(t.type === 'freeze'){
    box.innerHTML = `
      <button class="btn btn-primary" id="freezeStartBtn" style="margin-bottom:14px;">Включить музыку</button>
      <div class="game-status" id="freezeStatus"></div>
      <img id="freezePoseImg" class="freeze-pose-img" alt="">
      <div id="freezeCaptureArea"></div>
    `;
    initFreezeGame();
  }
  else if(t.type === 'game'){
    box.innerHTML = `
      <div class="pad-grid">
        <button class="pad pad-gold" data-c="0"></button>
        <button class="pad pad-red" data-c="1"></button>
        <button class="pad pad-silver" data-c="2"></button>
        <button class="pad pad-violet" data-c="3"></button>
      </div>
      <div class="game-status" id="gameStatus">Смотри на огни...</div>
    `;
    initGame();
  }
  else {
    // "find" type — just body + hint, manual "Готово"
  }
}

function initPhotoClue(t){
  const box = document.getElementById('taskInteractive');
  let step = 0;

  function showStep(){
    box.innerHTML = '';

    if(step < t.clues.length){
      const clue = t.clues[step];
      const label = document.createElement('div');
      label.className = 'sound-round-label';
      label.textContent = (step+1) + ' из ' + t.clues.length;
      box.appendChild(label);

      const img = document.createElement('img');
      img.className = 'clue-img';
      img.src = photoClueImages[clue.image];
      box.appendChild(img);

      const text = document.createElement('div');
      text.className = 'clue-text';
      text.textContent = clue.text;
      box.appendChild(text);

      const btn = document.createElement('button');
      btn.className = 'btn btn-primary';
      btn.textContent = 'Нашли! Дальше';
      btn.onclick = ()=>{ step++; showStep(); };
      box.appendChild(btn);
    } else {
      const text = document.createElement('div');
      text.className = 'clue-text';
      text.textContent = 'Подарок найден? Сфотографируйтесь с ним на память!';
      box.appendChild(text);

      const wrap = document.createElement('div');
      wrap.className = 'capture-box';
      wrap.innerHTML = `
        <div>\ud83d\udcf8 Нажми, чтобы сфотографироваться с подарком</div>
        <input type="file" id="giftCap" accept="image/*" capture="environment">
        <img class="capture-preview" id="giftPrev">
      `;
      wrap.querySelector('input').addEventListener('change', function(e){
        if(e.target.files && e.target.files[0]){
          const url = URL.createObjectURL(e.target.files[0]);
          const prev = document.getElementById('giftPrev');
          prev.src = url;
          prev.style.display = 'block';
          setTimeout(nextTask, 900);
        }
      });
      wrap.addEventListener('click', function(e){
        if(e.target.tagName !== 'INPUT'){ wrap.querySelector('input').click(); }
      });
      box.appendChild(wrap);
    }
  }

  showStep();
}

function initSoundGuess(t){
  const box = document.getElementById('taskInteractive');
  const audio = document.getElementById('heroSound');
  let round = 0;

  function showRound(){
    box.innerHTML = '';
    const r = t.rounds[round];

    const label = document.createElement('div');
    label.className = 'sound-round-label';
    label.textContent = 'Мультфильм ' + (round+1) + ' из ' + t.rounds.length;
    box.appendChild(label);

    const playBtn = document.createElement('button');
    playBtn.className = 'btn btn-primary';
    playBtn.style.marginBottom = '14px';
    playBtn.textContent = '🔊 Включить звук';
    playBtn.onclick = ()=>{
      audio.src = r.audio;
      audio.currentTime = 0;
      audio.play().catch(()=>{ feedback.textContent = 'Не получилось включить звук — проверь, что файл лежит рядом с квестом.'; });
    };
    box.appendChild(playBtn);

    const answerRow = document.createElement('div');
    answerRow.className = 'puzzle-answer-row';
    answerRow.innerHTML = `
      <input type="text" id="soundAnswerInput" placeholder="Какой это мультфильм?">
      <button id="soundAnswerBtn">Ответить</button>
    `;
    box.appendChild(answerRow);

    const feedback = document.createElement('div');
    feedback.className = 'puzzle-feedback';
    box.appendChild(feedback);

    const revealImg = document.createElement('img');
    revealImg.className = 'sound-reveal-img';
    box.appendChild(revealImg);

    const input = answerRow.querySelector('#soundAnswerInput');
    const btn = answerRow.querySelector('#soundAnswerBtn');
    attachVoiceInput(answerRow, input);

    function checkAnswer(){
      const val = normalizeAnswer(input.value);
      if(val && val === normalizeAnswer(r.answer)){
        feedback.classList.add('win');
        feedback.textContent = 'Верно! Это «' + r.answer.charAt(0).toUpperCase() + r.answer.slice(1) + '»';
        input.disabled = true;
        btn.disabled = true;
        audio.pause();

        loadImageWithFallback(revealImg, r.reveal,
          ()=>{ revealImg.classList.add('show'); },
          ()=>{ revealImg.classList.remove('show'); }
        );

        setTimeout(()=>{
          round++;
          if(round >= t.rounds.length){ nextTask(); }
          else { showRound(); }
        }, 1800);
      } else {

/* ---- Ритм-код: 3 раунда хлопков/шагов со звуком, озвучивает приложение ---- */
const rhythmRounds = [
  ["👏","👏","🦶"],
  ["👏","🦶","👏","🦶"],
  ["👏","👏","🦶","👏","🦶","🦶"],
  ["👏","🦶","👏","👏","🦶","🦶","👏","🦶"],
  ["🦶","🦶","🦶","🦶","🦶","🦶","🦶","🦶","🦶","🦶"]
];

let rhythmAudioCtx = null;
function getRhythmAudioCtx(){
  if(!rhythmAudioCtx){
    rhythmAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(rhythmAudioCtx.state === 'suspended') rhythmAudioCtx.resume();
  return rhythmAudioCtx;
}

function playClapSound(ctx, t){
  const size = Math.floor(ctx.sampleRate * 0.15);
  const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<size;i++){ data[i] = (Math.random()*2-1) * Math.pow(1 - i/size, 2); }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const bandpass = ctx.createBiquadFilter();
  bandpass.type = 'bandpass';
  bandpass.frequency.value = 2200;
  bandpass.Q.value = 0.7;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(1, t);
  gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
  noise.connect(bandpass); bandpass.connect(gain); gain.connect(ctx.destination);
  noise.start(t); noise.stop(t + 0.15);
}

function playStompSound(ctx, t){
  const osc = ctx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(130, t);
  osc.frequency.exponentialRampToValueAtTime(48, t + 0.22);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(1, t);
  gain.gain.exponentialRampToValueAtTime(0.01, t + 0.28);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.28);
}

function playRhythmSequence(seq){
  const ctx = getRhythmAudioCtx();
  let t = ctx.currentTime + 0.08;
  seq.forEach(sym=>{
    if(sym === '👏') playClapSound(ctx, t);
    else playStompSound(ctx, t);
    t += 0.55;
  });
}

/* ---- Громкие аплодисменты — играют после каждого пройденного раунда/задания ---- */
function playApplause(){
  const ctx = getRhythmAudioCtx();
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.0001, ctx.currentTime);
  master.gain.exponentialRampToValueAtTime(1.1, ctx.currentTime + 0.06);
  master.gain.setValueAtTime(1.1, ctx.currentTime + 1.5);
  master.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2.3);
  master.connect(ctx.destination);

  function singleClap(t, vol){
    // sharp attack transient
    const size1 = Math.floor(ctx.sampleRate * 0.012);
    const buf1 = ctx.createBuffer(1, size1, ctx.sampleRate);
    const d1 = buf1.getChannelData(0);
    for(let j=0;j<size1;j++){ d1[j] = (Math.random()*2-1) * Math.pow(1 - j/size1, 0.7); }
    const attack = ctx.createBufferSource();
    attack.buffer = buf1;
    const attackFilter = ctx.createBiquadFilter();
    attackFilter.type = 'highpass';
    attackFilter.frequency.value = 2500 + Math.random()*1500;
    const attackGain = ctx.createGain();
    attackGain.gain.setValueAtTime(vol, t);
    attackGain.gain.exponentialRampToValueAtTime(0.01, t + 0.02);

    // broader "smack" body
    const size2 = Math.floor(ctx.sampleRate * (0.05 + Math.random()*0.04));
    const buf2 = ctx.createBuffer(1, size2, ctx.sampleRate);
    const d2 = buf2.getChannelData(0);
    for(let j=0;j<size2;j++){ d2[j] = (Math.random()*2-1) * Math.pow(1 - j/size2, 1.3); }
    const body = ctx.createBufferSource();
    body.buffer = buf2;
    const bandpass = ctx.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.value = 1200 + Math.random()*2800;
    bandpass.Q.value = 0.5 + Math.random()*0.5;
    const bodyGain = ctx.createGain();
    bodyGain.gain.setValueAtTime(vol * 0.8, t);
    bodyGain.gain.exponentialRampToValueAtTime(0.01, t + size2/ctx.sampleRate);

    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if(pan){ pan.pan.value = (Math.random()*2-1) * 0.8; }

    attack.connect(attackFilter); attackFilter.connect(attackGain);
    body.connect(bandpass); bandpass.connect(bodyGain);
    if(pan){
      attackGain.connect(pan); bodyGain.connect(pan); pan.connect(master);
    } else {
      attackGain.connect(master); bodyGain.connect(master);
    }
    attack.start(t); attack.stop(t + 0.02);
    body.start(t); body.stop(t + size2/ctx.sampleRate);
  }

  // Крупная толпа хлопков: густо в начале, постепенно реже к концу (естественное затухание)
  const totalDuration = 2.2;
  const hits = 150;
  for(let i=0; i<hits; i++){
    const r = Math.random();
    const tOffset = totalDuration * (1 - Math.pow(1 - r, 2.2));
    const t = ctx.currentTime + 0.03 + tOffset;
    const vol = 0.35 + Math.random()*0.45;
    singleClap(t, vol);
  }
}

/* ---- Переиспользуемая кнопка голосового ввода для полей ответа ---- */
function attachVoiceInput(row, input){
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.createElement('button');
  micBtn.type = 'button';
  micBtn.className = 'mic-btn-inline';
  micBtn.textContent = '🎤';
  micBtn.title = 'Ответить голосом';
  row.appendChild(micBtn);

  if(!SpeechRec){
    micBtn.disabled = true;
    micBtn.title = 'Голосовой ввод не поддерживается этим браузером';
    return;
  }

  const recognition = new SpeechRec();
  recognition.lang = 'ru-RU';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  let listening = false;

  micBtn.addEventListener('click', ()=>{
    if(listening) return;
    listening = true;
    micBtn.classList.add('listening');
    recognition.start();
  });

  recognition.onresult = (e)=>{
    input.value = e.results[0][0].transcript.trim();
  };
  recognition.onerror = ()=>{
    listening = false;
    micBtn.classList.remove('listening');
  };
  recognition.onend = ()=>{
    listening = false;
    micBtn.classList.remove('listening');
  };
}

function normalizeAnswer(str){

/* ---- simple simon-style memory game ---- */
function initGame(){
  const pads = Array.from(document.querySelectorAll('.pad'));
  const status = document.getElementById('gameStatus');
  let sequence = [];
  let userStep = 0;
  let round = 0;
  const maxRounds = 3;
  let locked = true;

  function lightPad(i, ms){
    return new Promise(res=>{
      pads[i].classList.add('lit');
      setTimeout(()=>{ pads[i].classList.remove('lit'); res(); }, ms);
    });
  }

  async function playSequence(){
    locked = true;
    status.textContent = 'Смотри на огни...';
    await new Promise(r=>setTimeout(r,500));
    for(const i of sequence){
      await lightPad(i, 420);
      await new Promise(r=>setTimeout(r,180));
    }
    status.textContent = 'Повтори по порядку!';
    userStep = 0;
    locked = false;
  }

  function addRound(){
    round++;
    sequence.push(Math.floor(Math.random()*4));
    playSequence();
  }

  pads.forEach(p=>{
    p.addEventListener('click', ()=>{
      if(locked) return;
      const c = parseInt(p.getAttribute('data-c'));
      p.classList.add('lit');
      setTimeout(()=>p.classList.remove('lit'),200);
      if(c === sequence[userStep]){
        userStep++;
        if(userStep === sequence.length){
          if(round >= maxRounds){
            status.textContent = 'Идеально! Ты прошёл трек 🎉';
            locked = true;
            setTimeout(nextTask, 900);
          } else {
            status.textContent = 'Есть! Следующий раунд...';
            locked = true;
            setTimeout(addRound, 900);
          }
        }
      } else {
        status.textContent = 'Почти! Пробуем этот раунд снова.';
        userStep = 0;
        locked = true;
        setTimeout(playSequence, 800);
      }
    });
  });

  addRound();
}

function finishQuest(){
  document.getElementById('finaleTitle').innerHTML = kidName.toUpperCase() + '<span>КОРОЛЬ ПОП!</span>';
  document.getElementById('finaleMsg').textContent = CONFIG.finalMessage;
  showScreen('screen-finale');
  launchConfetti();
  const finaleVideo = document.getElementById('finaleVideo');
  finaleVideo.muted = false;
  finaleVideo.currentTime = 0;
  finaleVideo.play().catch(()=>{});
}

function restart(){
  current = -1;
  showScreen('screen-start');
}

function launchConfetti(){
  const layer = document.createElement('div');
  layer.className = 'confetti';
  document.body.appendChild(layer);
  const colors = ['#ff3d94','#2ee6c9','#a76bff','#f2b544','#5b8dee','#f5f4ef'];
  for(let i=0;i<60;i++){
    const bit = document.createElement('div');
    bit.className = 'bit';
    bit.style.left = Math.random()*100 + 'vw';
    bit.style.background = colors[Math.floor(Math.random()*colors.length)];
    bit.style.animationDuration = (2.5 + Math.random()*2) + 's';
    bit.style.animationDelay = (Math.random()*1.2) + 's';
    layer.appendChild(bit);
  }
  setTimeout(()=>layer.remove(), 5000);
}
</script>
